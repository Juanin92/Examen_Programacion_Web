<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Inicio de Sesión</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='ejercicio2.css')}}">
</head>
<body>
<div class="card-container">
    <h2>Inicio de Sesión</h2>

    <form action="/ejercicio2" method="POST">
        <div class="form-group">
            <label>Ingresa tu nombre</label>
            <input type="text" name="usuario" class="form-control" required value="{{ usuario if usuario else ''}}">
        </div>

        <div class="form-group">
            <label>Ingresa tu contraseña</label>
            <input type="password" name="password" class="form-control" required >
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    {% if mensaje %}
    <div class="resultado-box">
        <p>{{ mensaje}}</p>
    </div>
    {% endif %}
</div>
</body>
</html>
